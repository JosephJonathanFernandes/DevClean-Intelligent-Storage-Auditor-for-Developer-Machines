[project]
name = "devclean"
version = "1.0.0"
description = "An intelligent storage auditor for developer machines."
authors = [{ name = "Joseph Jonathan Fernandes" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/JosephJonathanFernandes/DevClean-Intelligent-Storage-Auditor-for-Developer-Machines"
Issues = "https://github.com/JosephJonathanFernandes/DevClean-Intelligent-Storage-Auditor-for-Developer-Machines/issues"

[project.scripts]
devclean = "devclean.presentation.cli.main:app"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.82.0",
    "syrupy>=4.0.0",
    "import-linter>=1.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.importlinter]
root_package = "devclean"

[[tool.importlinter.contracts]]
name = "Clean Architecture Boundaries"
type = "layers"
layers = [
    "devclean.presentation",
    "devclean.infrastructure",
    "devclean.application",
    "devclean.domain"
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --strict-markers --benchmark-skip"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[project.entry-points."devclean.analyzers"]
python = "devclean.infrastructure.python.analyzer:PythonAnalyzer"
chrome = "devclean.infrastructure.chrome.analyzer:ChromeAnalyzer"
docker = "devclean.infrastructure.docker.analyzer:DockerAnalyzer"
wsl = "devclean.infrastructure.wsl.analyzer:WSLAnalyzer"
